<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AyubGlobal</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}.app{max-width:430px;margin:auto;min-height:100vh;background:linear-gradient(#08182c,#06101d);position:relative;overflow:hidden}header{padding:20px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.globe{width:38px;height:38px;border-radius:50%;background:#1683ff;display:flex;align-items:center;justify-content:center}.search{margin:0 16px;padding:14px 16px;background:#12243a;border:1px solid #23405e;border-radius:14px;color:#9fb2c9}.map{height:500px;margin-top:10px;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#123e66 0 20%,#0b2947 35%,transparent 55%)}.earth{width:270px;height:270px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5fb8ff,#1261a8 45%,#062b50 75%);box-shadow:0 0 45px #1683ff66,inset -35px -25px 55px #0008;position:relative}.land{position:absolute;background:#35a86b;border-radius:55% 45% 50% 40%;opacity:.9}.l1{width:75px;height:55px;left:45px;top:55px;transform:rotate(-15deg)}.l2{width:95px;height:70px;right:35px;top:80px;transform:rotate(20deg)}.l3{width:60px;height:80px;left:105px;bottom:35px;transform:rotate(15deg)}.pin{position:absolute;width:18px;height:18px;background:#ff4f6d;border:3px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 10px #0008}.p1{left:55px;top:105px}.p2{right:60px;top:115px;background:#ffd34d}.p3{left:130px;bottom:55px;background:#37e28a}.info{position:absolute;bottom:25px;left:18px;right:18px;background:#10243aee;border:1px solid #274867;border-radius:18px;padding:17px}.info b{font-size:20px}.info small{display:block;color:#a9bbcf;margin-top:5px}.tabs{position:absolute;bottom:0;left:0;right:0;background:#081727;border-top:1px solid #1e3851;display:flex;justify-content:space-around;padding:13px 5px 16px}.tab{text-align:center;color:#8397ad;font-size:12px}.tab.active{color:#43a1ff}.icon{font-size:20px;margin-bottom:4px}</style></head><body><div class="app"><header><div class="logo">🌍 AyubGlobal</div><div class="globe">✦</div></header><div class="search">🔎 Davlat, shahar yoki joy qidiring...</div><section class="map"><div class="earth"><div class="land l1"></div><div class="land l2"></div><div class="land l3"></div><div class="pin p1"></div><div class="pin p2"></div><div class="pin p3"></div></div><div class="info"><b>📍 Samarqand, O‘zbekiston</b><small>Hozirgi joylashuv • 3D xarita</small></div></section><nav class="tabs"><div class="tab active"><div class="icon">🗺️</div>Xarita</div><div class="tab"><div class="icon">📍</div>Borgan joylar</div><div class="tab"><div class="icon">🕘</div>Tarix</div><div class="tab"><div class="icon">👤</div>Profil</div></nav></div></body></html>
